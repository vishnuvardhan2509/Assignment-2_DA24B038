services:
  cache:
    image: redis:7-alpine
    container_name: spam-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spam-api
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://cache:6379/0
      CACHE_TTL: "3600"
    depends_on:
      cache:
        condition: service_healthy